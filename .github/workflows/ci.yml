name: Continuous Integration
run-name: |
  ${{
    format(
      'Continuous Integration: {0}',
      case(
        github.event_name == 'push', 'On Push',
        github.event_name == 'pull_request', format('On Pull Request #{0}', github.event.pull_request.number),
        'Unknown Trigger'
      )
    )
  }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  run:
    name: Build Solution and Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: '[Git] Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '[.NET] Install SDK'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: '[.NET] Restore'
        run: dotnet restore

      - name: '[.NET] Build'
        run: dotnet build -c Release --no-restore

      - name: '[.NET] Test'
        run: dotnet test -c Release --no-build -- --report-gh
